services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chilidetect_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./cabai_db.sqlite:/app/cabai_db.sqlite
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=http://localhost:3000,http://103.18.76.90:3000,http://103.18.76.90
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chilidetect_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

networks:
  default:
    name: chili_network
